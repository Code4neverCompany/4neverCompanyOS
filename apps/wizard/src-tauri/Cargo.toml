[package]
name = "c4n-wizard"
version = "0.0.1"
description = "4neverCompany OS — first-run wizard"
authors = ["4neverCompany"]
edition = "2021"
# Internal to the 4neverCompany OS workspace. See the rationale in
# apps/desktop/src-tauri/Cargo.toml; this mirrors the same policy
# across the workspace.
publish = false
# License declaration. Mirrors the workspace's intent to ship under
# MIT or Apache-2.0 once the project reaches v1.0. See
# apps/desktop/src-tauri/Cargo.toml for the full rationale and the
# `cargo deny check` job in .github/workflows/audit.yml that this
# satisfies.
license = "MIT OR Apache-2.0"

[lib]
name = "c4n_wizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Disable cargo's auto-test for the binary. The binary is a Tauri GUI app
# (Windows tags it for UAC elevation because the name contains "wizard");
# `cargo test --bin` would try to *launch* it as a test binary and fail
# with os error 740. There are no unit tests in main.rs anyway.
[[bin]]
name = "c4n-wizard"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
c4n-credential-storage = { path = "../../../crates/credential-storage" }
toml = "0.8"
dirs = "5"
