name: Supply-chain audits

on:
  push:
    branches: [main]
  pull_request:
  # Weekly cron on Monday at 06:00 UTC. Cargo-audit and pnpm-audit
  # advisory databases update continuously; the weekly cron ensures
  # the audit also runs on a clean tree even if no PRs land in a
  # given week, so a newly-disclosed advisory surfaces quickly.
  schedule:
    - cron: "0 6 * * 1"

# Cancel in-progress runs when a new commit lands on the same branch
# (mirrors ci.yml).
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per docs/pinned-versions.md. Node 22 is the current LTS line; pnpm 11.3.0
  # requires Node 22.13+ (uses node:sqlite, a Node 22 builtin).
  NODE_VERSION: "22"
  PNPM_VERSION: "11.3.0"

jobs:
  # ─── Rust supply-chain: cargo-deny + cargo-audit ──────────────────
  # Runs the full cargo-deny check (advisories, bans, licenses, sources)
  # followed by cargo-audit for a second opinion on the RustSec
  # advisory database. Both are run with the same Cargo.lock so the
  # output is comparable.
  rust-audit:
    name: Rust supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Install cargo-deny and cargo-audit via the locked version
      # metadata so the audit job's tools are pinned to a known-good
      # release. cargo install --locked reads the tool's own
      # Cargo.lock and refuses to install if any dep version drifts.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Cache cargo advisory-db
        # The advisory DB is cloned from GitHub on every run; cache
        # it across runs to make the weekly cron faster.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-advisory-db
          restore-keys: |
            ${{ runner.os }}-cargo-advisory-db-

      - name: Run cargo deny check
        # cargo deny check runs all four sub-checks (advisories, bans,
        # licenses, sources). The deny.toml policy in the repo root
        # is the single source of truth for the policy; the CI job
        # just runs it.
        run: cargo deny check

      - name: Run cargo audit
        # cargo-audit is a second opinion against the RustSec
        # advisory database. We run it after cargo-deny so the two
        # tools cross-check each other — cargo-deny applies the
        # deny.toml policy, cargo-audit reports the raw advisory
        # database state. `cargo audit` exits 0 when there are no
        # vulnerabilities (warnings about unmaintained crates are
        # surfaced as warnings, not errors).
        run: cargo audit

  # ─── JS supply-chain: pnpm audit ─────────────────────────────────
  # Runs pnpm's built-in audit against the npm advisory database
  # for the production dependency tree only (dev deps are out of
  # scope for the redistributable bundle). pnpm 11+ ships with the
  # `audit` subcommand built in.
  js-audit:
    name: JS supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Install with the strict lane's --frozen-lockfile so the
      # audit job always runs against the committed lockfile; the
      # PR-only non-strict lane in ci.yml is what regenerates the
      # lockfile.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # --prod audits only production dependencies. The
        # distribution bundle ships only production deps; dev deps
        # are build-time only (see LICENSES.md Tier 3).
        # Exit code: 0 on clean, 1 on any advisory. Job fails the
        # workflow if any prod-dep advisory is found.
        run: pnpm audit --prod

  # ─── Summary job — required for branch protection ────────────────
  supply-chain-pass:
    name: Supply-chain Pass
    needs: [rust-audit, js-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all audits succeeded
        run: |
          if [ "${{ needs.rust-audit.result }}" != "success" ] || \
             [ "${{ needs.js-audit.result }}" != "success" ]; then
            echo "::error::One or more audit jobs failed."
            echo "::error::rust-audit: ${{ needs.rust-audit.result }}"
            echo "::error::js-audit:   ${{ needs.js-audit.result }}"
            exit 1
          fi
          echo "All supply-chain audits passed."
