<!DOCTYPE html>
<html lang="de">
<!--
  4never Company — INSTAGRAM POST (Quadrat)
  Canvas: 1080 x 1080 px.
  BEARBEITEN: Headline im <h1 class="headline"> (2 Zeilen empfohlen),
              Sub-Zeile im <p class="sub">.
  EXPORT (PNG): DevTools (F12) -> Strg+Shift+P -> "Capture node screenshot"
  auf dem <div class="canvas">. Ergebnis: pixelgenaues 1080x1080-PNG.
-->
<head>
<meta charset="utf-8">
<title>4never Company — Instagram Post 1080x1080</title>
<style>
  :root{
    --ink:#0b0b14; --panel:#12121e;
    --gold:#d4af37; --gold-light:#f0d778; --gold-deep:#8a6d1f;
    --foil:linear-gradient(135deg,#f0d778 0%,#d4af37 45%,#8a6d1f 100%);
    --cyan:#22d3ee; --magenta:#e935f0;
    --serif:Georgia,'Times New Roman',serif;
    --sans:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    --track:.28em; --text:#e8e6df; --muted:rgba(232,230,223,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#08080f;font-family:var(--sans);color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 20px}
  .screen-note{font-size:12px;letter-spacing:var(--track);text-transform:uppercase;color:var(--muted)}
  .canvas{
    position:relative;width:1080px;height:1080px;overflow:hidden;flex:none;
    background:radial-gradient(80% 80% at 50% 34%,#161624 0%,var(--ink) 68%);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;
  }
  .ring{
    position:absolute;left:50%;top:360px;transform:translate(-50%,-50%);
    width:520px;height:520px;border-radius:50%;
    border:3px solid rgba(34,211,238,.8);
    box-shadow:0 0 60px rgba(34,211,238,.5),inset 0 0 60px rgba(34,211,238,.22),0 0 160px rgba(233,53,240,.22);
  }
  .ring::after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid rgba(233,53,240,.4)}
  .logo{position:absolute;left:50%;top:360px;transform:translate(-50%,-50%);width:300px;height:300px;filter:drop-shadow(0 0 30px rgba(212,175,55,.4))}
  .headline{
    position:absolute;left:80px;right:80px;top:700px;text-align:center;
    font-family:var(--serif);font-size:78px;line-height:1.12;
    background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{position:absolute;left:80px;right:80px;bottom:96px;text-align:center;
    font-size:24px;letter-spacing:var(--track);text-transform:uppercase;color:var(--cyan);
    text-shadow:0 0 12px rgba(34,211,238,.55)}
  .rule{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);width:220px;height:2px;background:var(--foil)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0d778"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#8a6d1f"/>
  </linearGradient>
</defs></svg>

<p class="screen-note">Instagram Post &middot; 1080&times;1080 px &middot; Export: DevTools Node-Screenshot</p>

<div class="canvas">
  <div class="ring"></div>
  <svg class="logo" viewBox="0 0 240 240" aria-hidden="true">
    <rect x="5" y="5" width="230" height="230" rx="40" fill="#0b0b14" stroke="url(#gf)" stroke-width="2.5"/>
    <path d="M102 72 L107 49 L114 61 L120 43 L126 61 L133 49 L138 72 Z" fill="url(#gf)"/>
    <circle cx="107" cy="45" r="3.5" fill="url(#gf)"/><circle cx="120" cy="39" r="3.5" fill="url(#gf)"/><circle cx="133" cy="45" r="3.5" fill="url(#gf)"/>
    <path d="M161.6 185.5 A56 56 0 1 1 161.6 110.5" fill="none" stroke="url(#gf)" stroke-width="15" stroke-linecap="round"/>
    <path d="M168 112 L136 156 L186 156 M168 112 L168 184" fill="none" stroke="url(#gf)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 class="headline">Headline hier &mdash;<br>zwei Zeilen wirken am besten</h1>
  <div class="rule"></div>
  <p class="sub">4never Company &middot; Agentic Business</p>
</div>
</body>
</html>
