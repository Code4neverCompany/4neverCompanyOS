[package]
name = "c4n-credential-storage"
version = "0.0.1"
edition = "2021"
description = "OS keychain abstraction (Win Credential Manager / macOS Keychain / Linux Secret Service). Used for Supermemory + GitHub credentials per Architecture D-9; Anthropic + Google live in their CLI's own stores."
authors = ["4neverCompany"]
# Internal to the 4neverCompany OS workspace. See the rationale in
# apps/desktop/src-tauri/Cargo.toml; this mirrors the same policy
# across the workspace.
publish = false
# License declaration. Mirrors the workspace's intent to ship under
# MIT or Apache-2.0 once the project reaches v1.0. Required by the
# `cargo deny check` license job in .github/workflows/audit.yml.
license = "MIT OR Apache-2.0"

[lib]
name = "c4n_credential_storage"
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
keyring = "3"
serde = { workspace = true }
