[package]
name = "c4n-credential-storage"
version = "0.0.1"
edition = "2021"
description = "OS keychain abstraction (Win Credential Manager / macOS Keychain / Linux Secret Service). Used for Supermemory + GitHub credentials per Architecture D-9; Anthropic + Google live in their CLI's own stores."
authors = ["4neverCompany"]

[lib]
name = "c4n_credential_storage"
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
keyring = "3"
serde = { workspace = true }

# security-hardening: opt-in feature that compiles the in-memory backend
# into a non-test build. Default off so the production binary never
# contains the HashMap state; tests use the impl via #[cfg(test)] directly.
# Downstream integration tests (e.g. desktop Tauri-command tests) can
# enable this feature to drive the public API without a real OS keychain.
[features]
default = []
test-backend = []
