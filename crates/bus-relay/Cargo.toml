[package]
name = "c4n-bus-relay"
version = "0.0.1"
edition = "2021"
description = "Bus relay sidecar. Subscribes to Paperclip's event system, normalizes messages into the bus envelope, broadcasts to IPC subscribers + the desktop UI WebSocket."
authors = ["4neverCompany"]
# Internal to the 4neverCompany OS workspace. See the rationale in
# apps/desktop/src-tauri/Cargo.toml; this mirrors the same policy
# across the workspace.
publish = false
# License declaration. Mirrors the workspace's intent to ship under
# MIT or Apache-2.0 once the project reaches v1.0. Required by the
# `cargo deny check` license job in .github/workflows/audit.yml.
license = "MIT OR Apache-2.0"

[lib]
name = "c4n_bus_relay"
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Story 2.7: ISO-8601 (RFC-3339) timestamps for the bus envelope `ts` field
# when a Paperclip event arrives without one. default-features off keeps the
# build slim — mirrors the c4n-persona-supervisor pin.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Story 2.7: UUID v4 for the envelope `id` field when a relayed Paperclip
# event carries no SSE `id:` we can reuse (used for de-dup / trace per the
# bus envelope spec in architecture.md §5).
uuid = { version = "1", features = ["v4"] }