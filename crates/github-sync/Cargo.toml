[package]
name = "c4n-github-sync"
version = "0.0.1"
edition = "2021"
description = "GitHub sync for vault configs, BMAD artifacts, skills, personas. FR-33/34."
authors = ["4neverCompany"]
# Internal to the 4neverCompany OS workspace. See the rationale in
# apps/desktop/src-tauri/Cargo.toml; this mirrors the same policy
# across the workspace.
publish = false
# License declaration. Mirrors the workspace's intent to ship under
# MIT or Apache-2.0 once the project reaches v1.0. Required by the
# `cargo deny check` license job in .github/workflows/audit.yml.
license = "MIT OR Apache-2.0"

[lib]
name = "c4n_github_sync"
crate-type = ["rlib"]

[dependencies]
c4n-credential-storage = { path = "../credential-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
chrono = { workspace = true }
